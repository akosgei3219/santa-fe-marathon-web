  voiceEyebrow:"Official Event Narrative",
  voiceTitle:"The Voice of the River Trail",
  voiceParas:[
    "I am more than dirt, gravel, and stone. I am the Santa Fe River Trail, a living corridor of history tracing a path through the ancient heart of the high desert. For centuries, my banks have witnessed the movement of peoples, the flow of vital waters, and the quiet resilience of our community. When you run here, you are stepping directly into a story written by the land itself.",
    "My modern chapter began with three friends\u2014Abraham Kosgei, Joseph Karnes, and Antonio Lopez. Long before the race fields assembled, this corridor was their training ground. Driven by a shared conviction, they set out with a borrowed timing clock to design a premier distance race. What began as three friends moving along my banks quickly transformed into a powerful community movement. Five editions in, that foundational spirit remains untouched. The philosophy of the 3 Amigos has evolved to represent a profound alliance of three distinct global cultures joining together to uplift the human spirit through running, sustainable agriculture, and mutual support.",
    "Along my banks, the circle of the 3 Amigos stretches across an ocean. Jirani Kahawa, our coffee partner, trades directly with small-scale agricultural cooperatives in Kenya, returning economic self-reliance to the farmers who grow every cup poured beside my finish line. And when the festival quiets, nothing is wasted: one hundred percent of the spent coffee grounds are captured from the race festival areas and folded back into living soil, closing a circle that begins on a Kenyan hillside and ends in high-desert earth.",
    "Every footstep along my path ripples far beyond our high-desert horizon. Every entry directly supports the Kitany Water Project, bringing clean, life-sustaining water to agricultural communities in Kenya. Simultaneously, your stride carries forward the legacy of the Lightning Boy Foundation, honoring traditional Pueblo youth dance, while fueling local vocational training through Santa Fe YouthWorks and environmental composting cycles at Reunity Resources Farm."],

    ["Arrive early","Course roads close at 7:00 AM sharp. Field assembly opens at 7:00 AM at Romero's Park; the Half and Relay start at 7:30, the 5K at 8:00 at Reunity Resources Farm."],
    ["Wear your bib visibly","Your bib is chip-timed — pin it on your front. Never run under another person's bib; transfers closed September 10."],

  faqs:[
    {q:"How do I handle the altitude?",a:"Santa Fe sits at 7,000 feet, and it hits different if you're coming from sea level. Arrive two or three days early if you can, keep a water bottle glued to your hand all week, ease off the pace on the climbs, and don't judge your fitness by your first shakeout here. The air is thin; that's the point."},
    {q:"Where is packet pickup?",a:"Friday, Sept 18 from 12–6 PM and Saturday, Sept 19 from 10 AM–5 PM. Pick up your bib and shirt at the Running Hub, 1100 Don Diego Ave, Suite B. The 2026 race is sold out, so no new entries are available. Half Marathon and 3-Amigos Relay runners can also pick up race morning, 6:00–7:00 AM at Romero's Park (the start line). 5K runners pick up at the Running Hub."},
    {q:"How does the relay sash work?",a:"The 3-Amigos Relay uses a ceremonial sash instead of a baton. Runner one wears it from the start, hands it off at each exchange zone, and runner three wears it across the line. The sash is chip-timed — no sash at the finish, no team time."},
    {q:"Is there a time limit?",a:"Yes — the half marathon course is fully supported for 4.5 hours after the 7:30 AM start. If you're near the back you'll still get a finish line; the course simply reopens to traffic on that schedule."},
    {q:"When does registration close?",a:({open:"Online registration closes Saturday, September 19 at 5:00 PM for every race: the Half Marathon, the 3-Amigos Relay, the Santa Fe 5K and the free Kids 1K Dash. Sign up on RunSignup before then.",walkup:"Online registration closed Thursday, September 17. You can register in person for any race during packet pickup hours and pay on site. On race morning, the Santa Fe 5K also takes walk-up entries at the 5K start line at Reunity Resources Farm, until 7:45 AM.",closed:"Registration for 2027 isn't open yet. Race weekend is Saturday, Sept 18 – Sunday, Sept 19, 2027. Sign up for race updates to hear when it opens."})[REG_STATE]},
    {q:"Can I defer or transfer my entry?",a:"Entries are non-refundable. The free deferral and bib-transfer window closed on September 10, 2026, so entries can no longer be deferred or transferred, and there are no race-day changes."}

  storyKicker:"Más que una carrera",storyTitle:"Por qué corremos esta",
  storyBody1:"Tres amigos fundaron esta carrera — Abraham Kosgei, Joseph Karnes y Antonio Lopez — con un reloj prestado y la convicción de que Santa Fe merecía una carrera a la altura de la tierra donde entrenamos. Cinco ediciones después, la siguen organizando corredores, y la comunidad sigue primero.",

  voiceEyebrow:"Narrativa oficial del evento",
  voiceTitle:"La voz del River Trail",
  voiceParas:[
    "Soy m\u00e1s que tierra, grava y piedra. Soy el Santa Fe River Trail, un corredor vivo de historia que traza un camino por el antiguo coraz\u00f3n del alto desierto. Durante siglos, mis orillas han sido testigo del movimiento de los pueblos, del flujo de aguas vitales y de la callada resiliencia de nuestra comunidad. Cuando corres aqu\u00ed, entras directamente en una historia escrita por la tierra misma.",
    "Mi cap\u00edtulo moderno comenz\u00f3 con tres amigos: Abraham Kosgei, Joseph Karnes y Antonio Lopez. Mucho antes de que se reunieran los grupos de corredores, este corredor era su terreno de entrenamiento. Movidos por una convicci\u00f3n compartida, salieron con un reloj prestado a dise\u00f1ar una carrera de fondo de primer nivel. Lo que empez\u00f3 como tres amigos avanzando por mis orillas se transform\u00f3 pronto en un poderoso movimiento comunitario. Cinco ediciones despu\u00e9s, ese esp\u00edritu fundacional sigue intacto. La filosof\u00eda de los 3 Amigos ha evolucionado hasta representar una profunda alianza de tres culturas globales distintas que se unen para elevar el esp\u00edritu humano a trav\u00e9s del running, la agricultura sostenible y el apoyo mutuo.",
    "En mis orillas, el c\u00edrculo de los 3 Amigos se extiende a trav\u00e9s de un oc\u00e9ano. Jirani Kahawa, nuestro socio cafetero, comercia directamente con peque\u00f1as cooperativas agr\u00edcolas de Kenia, devolviendo autosuficiencia econ\u00f3mica a los caficultores que cultivan cada taza servida junto a mi meta. Y cuando la fiesta se apaga, nada se desperdicia: el cien por ciento de la borra de caf\u00e9 se recupera de las \u00e1reas del festival y vuelve a la tierra viva, cerrando un c\u00edrculo que comienza en una ladera keniana y termina en el suelo del alto desierto.",

}

/* ================= top strip (2026-09-15 hero v3) =================
   Kosgei's layered-hero brief: one slim bar with the date, place and altitude, a live countdown to the 7:30 AM start,
   and the road-closure notice (it opens the closures panel in the logistics accordion). After the start the countdown
   becomes a results link. ?regnow=<epoch ms> shifts this clock too, so race-morning states can be previewed. */
const NOW_SHIFT = REG_NOW - Date.now();
function useNow(){
  const [now,setNow]=useState(Date.now()+NOW_SHIFT);
  useEffect(()=>{const id=setInterval(()=>setNow(Date.now()+NOW_SHIFT),1000);return ()=>clearInterval(id);},[]);
  return now;
}

function Glyph({name,size=16}){
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false">{GLYPHS[name]}</svg>;

function TopStrip({t}){
  const now=useNow();
  const started=now>=RACE_START.getTime();
  let diff=Math.max(0,RACE_START.getTime()-now);
  const d=Math.floor(diff/86400000); diff-=d*86400000;
  const h=Math.floor(diff/3600000); diff-=h*3600000;
  const m=Math.floor(diff/60000); const sec=Math.floor((diff-m*60000)/1000);
  const pad=v=>String(v).padStart(2,"0");
  return (
    <div className="top-strip on-banner">
      <div className="top-strip-in">
        <span className="ts-facts">
          <span>{t.bannerDate}</span>
          <span className="ts-dot ts-place" aria-hidden="true">·</span>
          <span className="ts-place">{t.stripPlace}</span>
          <span className="ts-dot ts-alt" aria-hidden="true">·</span>
          <span className="ts-alt">{t.stripAlt}</span>
        </span>
        {started
          ? null
          : <span className="ts-count" role="timer" aria-label={t.countdown}>
              <span className="ts-count-lbl" aria-hidden="true">{t.stripStarts}</span>
              <span>{pad(d)+t.unitD+" "+pad(h)+t.unitH+" "+pad(m)+t.unitM+" "+pad(sec)+t.unitS}</span>
            </span>}
        <span className="ts-notice">{t.stripRoads}</span>
      </div>
    </div>
  );
}

function Concierge({t,lang,open,onClose}){
  const [q,setQ]=useState("");
  const inputRef=useRef(null);
  useEffect(()=>{if(open){setQ("");var id=setTimeout(function(){if(inputRef.current)inputRef.current.focus();},60);return ()=>clearTimeout(id);}},[open]);
  useEffect(()=>{
    if(!open)return;
    const h=e=>{if(e.key==="Escape")onClose();};
    document.addEventListener("keydown",h);
    return ()=>document.removeEventListener("keydown",h);
  },[open,onClose]);
  if(!open)return null;
  const ql=q.trim().toLowerCase();
  /* match both directions: a whole-phrase hit scores 2, a word that prefixes a
     keyword (or vice versa) scores 1 - so "park" still finds "parking" */
  const toks=ql.split(/[^a-z0-9]+/).filter(t=>t.length>=3);
  const score=r=>r.k.reduce((a,kw)=>{
    if(ql.includes(kw))return a+2;
    return a+(toks.some(t=>kw.indexOf(t)===0||t.indexOf(kw)===0)?1:0);
  },0);
  const hits=ql?CONCIERGE_ROUTES.map(r=>({r,s:score(r)}))
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3):[];
  const chips=[[t.conciergeChip1,"altitude pacing"],[t.conciergeChip2,"parking shuttle"],[t.conciergeChip3,"burritos festival"]];
  return (
    <div className="cg-overlay" role="dialog" aria-modal="true" aria-label={t.conciergeTitle} onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="cg-card">
        <div className="cg-head">
          <div className="flex items-center gap-2">
            <span className="cg-dot" aria-hidden="true"></span>
            <h3 className="cg-title">{t.conciergeTitle}</h3>
          </div>
          <button type="button" className="cg-close" aria-label={t.conciergeClose} onClick={onClose}>
            <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div className="cg-field">
          <svg aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.4" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path strokeLinecap="round" d="M21 21l-4.35-4.35"/></svg>
          <input ref={inputRef} type="text" value={q} onChange={e=>setQ(e.target.value)} placeholder={t.conciergePh} autoComplete="off" aria-label={t.conciergePh}/>
        </div>
        <div className="cg-results" aria-live="polite">
          {!ql && (
            <div>
              <p className="cg-sublabel">{t.conciergeSuggest}</p>
              <div className="flex flex-wrap gap-2">
                {chips.map(([label,query])=>(<button key={label} type="button" className="cg-chip" onClick={()=>setQ(query)}>{label}</button>))}
              </div>
            </div>
          )}
          {ql && hits.length>0 && hits.map(({r})=>(
            <a key={r.p} className="cg-answer" href={r.p} target={r.p.indexOf("http")===0?"_blank":undefined} rel={r.p.indexOf("http")===0?"noopener":undefined}>
              <span className="cg-fact">{lang==="es"&&r.fs?r.fs:r.f}</span>
              <span className="cg-go">{t.conciergeOpen}</span>
            </a>
          ))}
          {ql && hits.length===0 && (
            <a className="cg-answer" href="/contact-us/">
              <span className="cg-fact">{t.conciergeNone}</span>
              <span className="cg-go">{t.conciergeContact}</span>
            </a>
          )}
        </div>
      </div>
    </div>
  );
}

function Nav({t,lang,setLang}){
  const [open,setOpen]=useState(false);
  const [ask,setAsk]=useState(false);
  /* IA v4 (matches template 2365): three grouped dropdowns + disabled Store chip.
     Every pre-v4 anchor destination is preserved inside the groups - zero drops. */
  /* 2026-09-23 flat IA (Kosgei): four explicit top-level links, no dropdowns.
     The fourth is the high-contrast anchor button. It is NOT a bare "Register": the race is
     SOLD OUT and CLAUDE.md rule 9 requires this control to branch on all three registration
     states, so it renders Register only when REG_STATE is actually open. Shipping a Register
     button today would tell runners they can enter a race that is closed. */
  /* 2026-09-23: Results & Photos added as a FIFTH link (Kosgei). The first flat build
     dropped it -- the 21 dropdown links collapsed to four and this was the only route to
     the results page anywhere on the homepage (the footer carries just mailto and tel).
     Four days after the race that is the page people arrive for, so it is explicit. */
  const FLAT_NAV=[["#races",t.nav.fRace],["#course",t.nav.fCourse],["/lodging-travel/",t.nav.fTravel],["/race-information/results-photos/",t.nav.results]];
  const REG_HREF = IS_RACE_DAY ? "/race-information/results-photos/"
    : REG_STATE==="open" ? REG_URL : REG_STATE==="walkup" ? "#races" : "/news/newsletter/";
  const REG_LABEL = IS_RACE_DAY ? t.nav.liveResults
    : REG_STATE==="open" ? t.nav.register : REG_STATE==="walkup" ? t.walkupShort : t.footerNews;
  const groups=[
    {key:"races",label:t.nav.gRaces,items:[["/the-races/",t.nav.overview],["#races",t.nav.races2],["/course-map/",t.nav.courseMap],["/course-highlights/",t.nav.courseHi],["/relays-exchange-zones/",t.nav.relay],["/time-limits/",t.nav.limits]]},
    {key:"info",label:t.nav.gInfo,items:[["#plan",t.nav.plan],["#guidelines",t.nav.guide],["#faq",t.nav.faq],["/event-schedule/",t.nav.sched],["/packet-pickup/",t.nav.packet],["/transportation-parking/",t.nav.parking],["/race-information/results-photos/",t.nav.results]]},
    {key:"exp",label:t.nav.gExp,items:[["/experience-santa-fe/",t.nav.overview],["#story",t.nav.story],["#sponsors",t.nav.sponsors],["/host-city-guide/",t.nav.hostcity],["/spectator-guide/",t.nav.spectator],["/finish-line-festival/",t.nav.festival],["/lodging-travel/",t.nav.lodging],["/volunteer/",t.nav.volunteer]]}
  ];
  return (
    <div className="sticky top-0 z-50 border-b" style={{background:"var(--sand-2)",borderColor:"var(--line)"}}>
      <nav aria-label="Main" className="max-w-[1080px] mx-auto px-5 py-3 flex items-center justify-between gap-4">
        <a href="#top" className="flex items-center gap-2.5 no-underline" style={{color:"var(--ink)"}}>
          <img src={IMGS.logo} alt="Santa Fe International Half Marathon" className="h-11 w-11 shrink-0 object-contain rounded-full" style={{background:"#FFFFFF",border:"1px solid var(--line)"}}/>
          <span className="display text-[.95rem] tracking-[.02em] whitespace-nowrap hidden min-[430px]:inline">Santa Fe Intl Half</span>
        </a>
        <div className="flex items-center gap-2 shrink-0">
          <div className="hidden md:flex gap-5 items-center">
            {FLAT_NAV.map(([h,l])=>(
              <a key={h} href={h} className="navflat display no-underline text-[.8rem] py-2 whitespace-nowrap">{l}</a>
            ))}
            <a className="nav-reg display no-underline text-[.8rem] whitespace-nowrap" href={REG_HREF}>{REG_LABEL}</a>
            <span className="nav-soon display text-[.8rem] whitespace-nowrap" aria-disabled="true">{t.nav.store}<span className="soon-chip">{t.nav.soon}</span></span>
          </div>
          <button type="button" onClick={()=>setAsk(true)} className="cg-trigger" aria-label={t.conciergeBtn} aria-haspopup="dialog">
            <svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.4" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path strokeLinecap="round" d="M21 21l-4.35-4.35"/></svg>
          </button>
          <button onClick={()=>setLang(lang==="en"?"es":"en")} className="mono rounded-[3px] px-2.5 py-1.5 min-w-[44px] min-h-[40px] text-[.6875rem] font-bold cursor-pointer border"
            style={{background:"var(--chip)",color:"var(--ink)",borderColor:"var(--line)"}}
            aria-label={lang==="en"?"Cambiar a español":"Switch to English"}>
            {lang==="en"?"ES":"EN"}
          </button>
          {REG_STATE==="open"
            ? <a className="btn btn-primary !px-3.5 !py-2 !text-[.75rem]" href={REG_URL} target="_blank" rel="noopener">{t.nav.register}</a>
            : null}
          <button className="md:hidden rounded-[3px] px-2.5 py-2 cursor-pointer border inline-flex" aria-label="Menu" aria-expanded={open} aria-controls="mobile-menu"
            onClick={()=>setOpen(!open)} style={{background:"var(--card)",color:"var(--ink)",borderColor:"var(--line)"}}>
            <Ic name={open?"X":"Menu"} size={18}/>
          </button>
        </div>
      </nav>
      <Concierge t={t} lang={lang} open={ask} onClose={()=>setAsk(false)}/>
      {open && (
        <div id="mobile-menu" className="border-t md:hidden" style={{borderColor:"var(--line)",background:"var(--sand-2)"}}>
          <div className="max-w-[1080px] mx-auto px-5 py-2 flex flex-col">
            {groups.map(g=>(
              <div key={g.key} className="flex flex-col">
                <p className="display m-0 mt-3 mb-1 text-[.72rem] opacity-60" style={{color:"var(--ink)"}}>{g.label}</p>
                {g.items.map(([h,l])=>(<a key={h} href={h} onClick={()=>setOpen(false)} className="no-underline font-semibold py-2 pl-2 border-b text-[.95rem]" style={{color:"var(--ink)",borderColor:"var(--line)"}}>{l}</a>))}
              </div>
            ))}
            <p className="nav-soon display m-0 mt-3 mb-2 text-[.72rem]" aria-disabled="true">{t.nav.store}<span className="soon-chip">{t.nav.soon}</span></p>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= hero (2026-09-15 hero v3) =================
   Kosgei's 9/15 brief, which revises the 9/13 one-button hero: full-bleed photo (the runner under the big sky,
   media 4977) under a left-weighted dark gradient, the copy on the left, three value badges, the register button
   plus an outline button to the 2025 results (Results & Photos once the race starts), and the title sponsor pinned to
   the bottom edge.
   The photos stay background divs because the sitewide "html body img{height:auto!important}" rule defeats
   height-based image sizing.
   2026-09-15 hero v4 (Kosgei): the single photo became a RunSignup-style slideshow (useHeroSlides, below). On phones
   and tablets the slideshow is a photo band above the copy, with the caption and pause button just under it. */
function Hero({t}){
  const started=REG_NOW>=RACE_START.getTime();
  const sl=useHeroSlides();
  const n=HERO_SLIDES.length;
  return (
    <header id="top" className="hero3" aria-labelledby="hero-h">
      <div className={"hero-slides"+(sl.paused?" is-paused":"")} aria-hidden="true" onTouchStart={sl.touchStart} onTouchEnd={sl.touchEnd}>
        {HERO_SLIDES.map((s,i)=>(
          <div key={s.k} className={"hero-slide hero-slide-"+s.k+(i===sl.idx?" is-on":(i===sl.prev?" was-on":""))} data-src={s.src}
            style={sl.seen[i]?{backgroundImage:"url('"+s.src+"')"}:undefined}></div>
        ))}
      </div>
      <div aria-hidden="true" className="hero3-shade"></div>
      <div aria-hidden="true" className="hero3-contour"></div>
      <div className="hero3-in">
        <div className="hero3-copy">
          <h1 id="hero-h" className="hero3-title">{t.heroTitle}</h1>
          <p className="hero3-tag">{t.heroTagline.map((ln,i)=>(<span key={i} className={i===t.heroTagline.length-1?"hero-grit":undefined}>{(i?" ":"")+ln}</span>))}</p>
          <p className="hero3-date">{t.heroSubLine}</p>
          <div className="hero3-ctas">
            {REG_STATE==="open"
              ? <a className="hero-cta hero-cta-solid" href={REG_URL} target="_blank" rel="noopener"><span>{t.ctaHalf}</span></a>
              : REG_STATE==="walkup"
                ? <a className="hero-cta hero-cta-solid" href="#races"><span>{t.walkupShort}</span></a>
                : <a className="hero-cta hero-cta-solid" href="/news/newsletter/"><span>{t.footerNews}</span></a>}
          </div>
        </div>
        <p className="hero3-presented">{t.presentedLbl} <b>Capitol Ford</b></p>
        <div className="hero-slidebar" role="group" aria-roledescription={t.heroSlidesRole} aria-label={t.heroSlidesLbl}>
          <div className="hero-cap" aria-live={sl.paused||sl.userNav?"polite":"off"}>{t.heroSlides[HERO_SLIDES[sl.idx].k]}</div>
          <div className="hero-dots" onMouseEnter={sl.holdOn} onMouseLeave={sl.holdOff} onFocus={sl.holdOn} onBlur={sl.holdBlur}>
            {HERO_SLIDES.map((s,i)=>(
              <button key={s.k} type="button" className="hero-dot" aria-label={t.heroSlideN(i+1,n)} aria-current={i===sl.idx?"true":undefined} onClick={()=>sl.go(i,true)}><span></span></button>
            ))}
          </div>
          <button type="button" className="hero-pause" aria-label={sl.paused?t.heroPlay:t.heroPause} onClick={sl.toggle}>

/* 2026-09-15 hero v4: slideshow state shared by the photo stack and the controls under the copy.
   - Photos advance every HERO_SLIDE_MS. The race-video clip plays once, then the next photo follows. If the clip
     cannot play (autoplay refused, load error, data saver on) its poster stands in as a normal slide, and a clip that
     never ends still moves on after 20 seconds.
   - Visitors who ask for reduced motion start paused. The pause button stops rotation for everyone (WCAG 2.2.2).
     Pointer or keyboard focus on the dots holds the current slide, and a swipe on the photo band changes it.
   - A photo's background is set only once its slide is current or next, so the first view loads two images. */
function useHeroSlides(){
  const n=HERO_SLIDES.length;
  const qa=HERO_QA_SLIDE>=0;
  const first=qa?HERO_QA_SLIDE:0;
  const env=useMemo(()=>{
    const e={reduce:false,save:false,wide:true};
    try{e.reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(x){}
    try{e.save=!!(navigator.connection||{}).saveData;}catch(x){}
    try{e.wide=window.matchMedia("(min-width: 1024px)").matches;}catch(x){}
    return e;
  },[]);
  const [idx,setIdx]=useState(first);
  const [paused,setPaused]=useState(qa||env.reduce);
  const [hold,setHold]=useState(false);
  const [seen,setSeen]=useState(()=>{const o={};o[first]=true;o[(first+1)%n]=true;return o;});
  const [prev,setPrev]=useState(-1);
  /* Drives the caption's live region. An auto-advance every 6.5s must NOT be announced -- a
     screen reader would talk over the page indefinitely -- but a dot press, a swipe or a pause
     is a deliberate request and the new caption should be read out. */
  const [userNav,setUserNav]=useState(false);
  const touchX=useRef(null);
  const go=(i,byUser)=>{
    const j=(i+n)%n;
    if(j!==idx) setPrev(idx);
    setIdx(j);
    setUserNav(!!byUser);
    setSeen(s=>{const o=Object.assign({},s);o[j]=true;o[(j+1)%n]=true;return o;});
  };
  useEffect(()=>{
    if(paused||hold) return undefined;
    const id=setTimeout(()=>go(idx+1),HERO_SLIDE_MS);
    return ()=>clearTimeout(id);
  },[idx,paused,hold]);
  return {
    idx,prev,paused,seen,userNav,
    go,
    toggle:()=>{setUserNav(true);setPaused(p=>!p);},
    holdOn:()=>setHold(true),
    holdOff:()=>setHold(false),
    holdBlur:(e)=>{if(!e.currentTarget.contains(e.relatedTarget))setHold(false);},
    touchStart:(e)=>{touchX.current=e.touches[0].clientX;},
    touchEnd:(e)=>{
      const x0=touchX.current;
      touchX.current=null;
      if(x0===null) return;
      const dx=e.changedTouches[0].clientX-x0;
      if(Math.abs(dx)>40) go(dx>0?idx-1:idx+1,true);
    }
  };
}

const PROFILE=[6760,6768,6780,6775,6790,6802,6818,6838,6862,6883,6860,6828,6800,6788];
function Course({t}){
  const [wp,setWp]=useState(2);
  const wpMiles=[0,4,9,13.1];

  const y=e=>PADT+(1-(e-minE)/(maxE-minE))*(H-PADT-PADB);
  const pts=PROFILE.map((e,i)=>[x(i===13?13.1:i),y(e)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=line+` L${x(13.1).toFixed(1)},${y(minE)} L${x(0)},${y(minE)} Z`;

              <button key={i} onClick={()=>setWp(i)} aria-pressed={wp===i}
                className={"wp-item cursor-pointer"+(wp===i?" is-on":"")}
                style={{font:"inherit",color:"var(--ink)"}}>
                <div className="flex items-center gap-2.5">
                  <span className="mono text-[.6875rem] font-bold min-w-[7ch]" style={{color:wp===i?"var(--terra)":"var(--ink-soft)"}}>{w.mi}</span>
                  <strong className="text-[.92rem]">{w.name}</strong>
                </div>
                {wp===i && <p className="mt-2 mb-0 text-[.88rem]" style={{color:"var(--ink-soft)"}}>{w.detail}</p>}
              </button>
            ))}
          </div>
          <div className="course-chart overflow-x-auto">
            <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label={t.climbLabel+" — 6,883 ft, mile 9"}>
              {[6760,6820,6880].map(e=>(
                <g key={e}>
                  <line x1={PADL} x2={W-PADR} y1={y(e)} y2={y(e)} stroke="var(--line)" strokeWidth="1"/>
                  <text x={PADL-6} y={y(e)+3} textAnchor="end" fontSize="11" fill="var(--ink-soft)" fontFamily="'Martian Mono',monospace">{e.toLocaleString()}</text>
                </g>
              ))}
              <path d={area} fill="var(--sunset)" opacity="0.22"/>
              <path d={line} fill="none" stroke="var(--terra)" strokeWidth="2.5" strokeLinejoin="round"/>
              <circle cx={x(wpMiles[wp])} cy={y(wpElev[wp])} r="5" fill="var(--indigo-soft)" stroke="var(--sand)" strokeWidth="2"/>
              <text x={x(9)} y={y(6883)-8} textAnchor="middle" fontSize="11" fontWeight="700" fill="var(--ink)" fontFamily="'Martian Mono',monospace">6,883 ft</text>
              <text x={x(2.2)} y={y(6810)} textAnchor="middle" fontSize="11" fontWeight="700" fill="var(--terra)" fontFamily="'Martian Mono',monospace">{t.climbLabel}</text>
              {[0,4,9,13.1].map(m=>(
                <text key={m} x={x(m)} y={H-8} textAnchor="middle" fontSize="11" fill="var(--ink-soft)" fontFamily="'Martian Mono',monospace">{m===0?"Mi 0":m}</text>

            </svg>

          </div>
        </div>
      </div>
    </section>
  );
}

    const on=()=>{const h=hashId();if(ids.indexOf(h)>-1)setOpen(h);};
    window.addEventListener("hashchange",on);
    return ()=>window.removeEventListener("hashchange",on);
  },[]);
  const items=[[ids[0],t.transitTitle,<TransitBody t={t}/>],[ids[1],t.driveTitle,<DrivingBody t={t}/>],[ids[2],t.aidTitle,<AidBody t={t}/>]];
  return (

        </div>
        <p className="m-0 mb-6 text-[.9rem] opacity-85" style={{color:"inherit"}}>{t.logisticsIntro}</p>
        <div style={{borderTop:"1px solid rgba(255,255,255,.18)"}}>
          {items.map(([id,title,body])=>(
            <div key={id} id={id} style={{borderBottom:"1px solid rgba(255,255,255,.18)",scrollMarginTop:"86px"}}>
              <h3 className="m-0">
                <button type="button" className="acc-q" aria-expanded={open===id} aria-controls={id+"-panel"} onClick={()=>setOpen(open===id?"":id)}>

/* ================= footer ================= */
function Footer({t}){
  const [email,setEmail]=useState("");
  const [done,setDone]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(false);
  const submit=e=>{
    e.preventDefault();
    if(busy||!email.includes("@"))return;
    setBusy(true);setErr(false);
    const body=new URLSearchParams();
    body.set("action","fluentform_submit");
    body.set("form_id","3");
    body.set("data","email="+encodeURIComponent(email)+"&item_3__fluent_sf=");
    fetch("/wp-admin/admin-ajax.php",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()})
      .then(r=>r.json()).then(j=>{if(j&&j.success)setDone(true);else setErr(true);})
      .catch(()=>setErr(true)).finally(()=>setBusy(false));
  };
  const socials=[["Facebook","https://www.facebook.com/RunSantaFe"],["Instagram","https://www.instagram.com/runsantafe"]];
  return (
    <footer className="pt-16 pb-10 on-panel" style={{background:"var(--panel)",color:"var(--panel-fg)"}}>
      <div className="max-w-[1080px] mx-auto px-5 grid gap-10 grid-cols-1 md:grid-cols-2">
        <div>
          <h2 className="display text-[1.4rem] mb-2" style={{color:"inherit"}}>{t.footerNews}</h2>
          <p className="text-[.88rem] mb-4 max-w-[42ch] opacity-85">{t.footerNewsSub}</p>
          {done ? (
            <p className="mono text-[.8rem] font-bold" style={{color:"var(--sunset)"}} aria-live="polite">{t.subscribed}</p>
          ) : (
            <form onSubmit={submit} className="flex flex-wrap gap-2">
              <label className="flex-1 basis-[200px]">
                <span className="sr-only">{t.emailLbl}</span>
                <input type="email" required placeholder={t.emailPh} value={email} onChange={e=>setEmail(e.target.value)}
                  className="w-full" style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(245,237,224,.35)",color:"inherit"}}/>
              </label>
              <button className="btn" style={{background:"var(--sunset)",color:"#1E1530"}} type="submit" disabled={busy}>{busy? t.subscribing : t.subscribe}</button>
            </form>
          )}
          {err && <p className="mono text-[.7rem] mt-3" role="alert" style={{color:"var(--sunset)"}}>{t.subErr}</p>}
        </div>
        <div>
          <img src={IMGS.logo} alt="Santa Fe International Half Marathon - Capitol Ford International Races" loading="lazy"
            className="w-24 h-24 object-contain rounded mb-4 p-1" style={{background:"#FFFFFF"}}/>
          <h3 className="display text-[1rem] mb-3" style={{color:"inherit"}}>{t.contact}</h3>
          <p className="m-0 mb-1.5 text-[.9rem]"><a href="mailto:info@santafehalfmarathon.com" style={{color:"var(--sunset)"}}>info@santafehalfmarathon.com</a></p>
          <p className="mono m-0 mb-4 text-[.85rem]"><a href="tel:+15059209799" style={{color:"inherit",textDecoration:"none"}}>505-920-9799</a></p>
          <h3 className="display text-[1rem] mb-2" style={{color:"inherit"}}>{t.follow}</h3>
          <div className="flex gap-3 mb-4">
            {socials.map(([n,href])=>(
              <a key={n} href={href} target="_blank" rel="noopener" aria-label={n}
                className="inline-flex items-center justify-center w-9 h-9 rounded-full"
                style={{border:"1px solid rgba(245,237,224,.4)",color:"inherit"}}>
                <Ic name={n} size={16}/>
              </a>
            ))}
          </div>
          <p className="m-0 text-[.8rem] opacity-75 max-w-[40ch]">{t.footerNote}</p>
        </div>
      </div>
      <div className="max-w-[1080px] mx-auto px-5 mt-10 pt-5" style={{borderTop:"1px solid rgba(245,237,224,.2)"}}>
        <div className="flex flex-wrap items-center justify-between gap-x-6 gap-y-2">
          <p className="mono text-[.6875rem] opacity-60 m-0">© 2026 Santa Fe International Half Marathon</p>
          <p className="mono text-[.6875rem] m-0 flex gap-5">
            <a href="/privacy-policy/" style={{color:"inherit",opacity:.75}}>{t.legalPrivacy}</a>
            <a href="/refund-policy/" style={{color:"inherit",opacity:.75}}>{t.legalRefund}</a>
          </p>
        </div>
        <div className="h-14 md:hidden" aria-hidden="true"></div>
      </div>
    </footer>
  );
}

/* ================= mobile bottom cta ================= */
function MobileCta({t}){
  const [show,setShow]=useState(false);
  useEffect(()=>{
    const on=()=>setShow(window.scrollY>600);
    window.addEventListener("scroll",on,{passive:true});
    on();
    return ()=>window.removeEventListener("scroll",on);
  },[]);
  if(!show) return null;
  return (
    <div className="fixed bottom-0 inset-x-0 z-50 md:hidden flex items-center justify-between gap-3 px-4 py-2.5" style={{background:"var(--terra)",paddingBottom:"calc(.625rem + env(safe-area-inset-bottom))"}}>
      <span className="mono text-[.72rem] font-bold uppercase tracking-[.08em]" style={{color:"#FFF8EF"}}>{REG_STATE==="walkup" ? t.walkupShort : t.bannerDate}</span>
      {REG_STATE==="open"
        ? <a className="btn !py-2.5 !px-5" style={{background:"#FFF8EF",color:"#8C3A24"}} href={REG_URL} target="_blank" rel="noopener">{t.heroCta}</a>
        : null}
    </div>
  );
}

/* ================= app ================= */
function App(){
  const [lang,setLang]=useState("en");
  const t=T[lang];
  useEffect(()=>{document.documentElement.lang=lang;},[lang]);
  useEffect(()=>{
    let iv=null;
    const settle=()=>{
      if(iv)clearInterval(iv);
      const id=decodeURIComponent(location.hash.slice(1));if(!id)return;
      let ticks=0,stable=0;
      iv=setInterval(()=>{
        const el=document.getElementById(id);
        if(!el||++ticks>22){clearInterval(iv);iv=null;return;}
        const top=el.getBoundingClientRect().top;
        if(Math.abs(top-86)>6){el.scrollIntoView({behavior:"instant",block:"start"});stable=0;}
        else if(++stable>2){clearInterval(iv);iv=null;}
      },80);
    };
    const t=setTimeout(settle,300);
    window.addEventListener('hashchange',settle);
    return ()=>{clearTimeout(t);if(iv)clearInterval(iv);window.removeEventListener('hashchange',settle);};
  },[]);
  return (
    <React.Fragment>
      <a href="#main" className="skip-link">{t.skip}</a>
      <TopStrip t={t}/>
      <Nav t={t} lang={lang} setLang={setLang}/>
      <Hero t={t}/>
      <QuickBar t={t}/>
      <HeroFacts t={t}/>
      <main id="main">
        <Races t={t}/>
        <KidsRace t={t}/>
        <Course t={t}/>
        <Story t={t}/>
        <VoiceOfRiver t={t}/>
        <CommunityImpact t={t}/>
        <Schedule t={t}/>
        <Logistics t={t}/>
        <Shuttle t={t}/>
        <Ambassador t={t}/>
        <Perks t={t}/>
        <Travel t={t}/>
        <Guidelines t={t}/>
        <Faq t={t}/>
        <Sponsors t={t}/>
      </main>
      <Footer t={t}/>
      <MobileCta t={t}/>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
