<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFHM Hero — Dynamic Carousel Concept (prototype, not deployed)</title>
<style>
:root{
  --terra:#C2593F;--terra-glow:#E8764F;--sand:#FBF9F6;
  --font-display:'Archivo','Arial Narrow',sans-serif;--font-body:'Hanken Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#181512;color:#FFF;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.slide.active{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,.4) 50%,rgba(0,0,0,.06) 84%);pointer-events:none}
.wrap{position:relative;z-index:2;max-width:1180px;width:100%;margin:0 auto;padding:clamp(3rem,7vw,6rem) clamp(1.5rem,4.5vw,4rem)}
.inner{max-width:620px}
/* dynamic copy block cross-fades between slides; ask-pill below stays locked */
.copy{transition:opacity .45s ease,transform .45s ease;min-height:24rem}
.copy.swap{opacity:0;transform:translateY(10px)}
.tag{display:inline-flex;align-items:center;gap:.55rem;font-size:.72rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-bottom:2rem}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--terra-glow);flex:none}
h1{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(2.4rem,5vw,4.6rem);line-height:.97;letter-spacing:.012em;font-stretch:90%;color:#FFF;text-shadow:0 2px 24px rgba(0,0,0,.45)}
h1 .row{display:block}
h1 .river{color:var(--terra-glow);font-size:.6em;letter-spacing:.02em;margin-top:.4em;text-shadow:0 0 26px rgba(232,118,79,.55),0 2px 14px rgba(0,0,0,.5)}
.desc{max-width:50ch;margin:2rem 0 0;font-size:clamp(1rem,1.5vw,1.13rem);line-height:1.65;color:rgba(251,249,246,.88);text-shadow:0 1px 10px rgba(0,0,0,.4)}
.ask{display:flex;align-items:center;gap:.9rem;max-width:540px;margin-top:2.6rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:.5rem .65rem;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 18px 44px -22px rgba(0,0,0,.6)}
.ask .plus{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#FFF;font-size:1.35rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ask .field{position:relative;flex:1}
.ask input{width:100%;border:0;outline:none;background:transparent;font:inherit;font-size:.98rem;color:#FFF;padding:.62rem .25rem .28rem}
.ask input::placeholder{color:transparent}
.ask label{position:absolute;left:.25rem;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.75);font-size:.98rem;pointer-events:none;transition:all .18s ease}
.ask input:focus + label,.ask input:not(:placeholder-shown) + label{top:.05rem;transform:none;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--terra-glow)}
.note{margin-top:2.4rem;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
.navbtn:hover,.navbtn:focus-visible{background:rgba(0,0,0,.5)}
.navbtn svg{width:18px;height:18px;stroke:#FFF;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.navbtn.prev{left:clamp(.6rem,2vw,1.6rem)}
.navbtn.next{right:clamp(.6rem,2vw,1.6rem)}
.dots{position:absolute;left:0;right:0;bottom:clamp(1rem,3vh,2rem);z-index:3;display:flex;justify-content:center;gap:.65rem}
.dots button{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:transparent;cursor:pointer;padding:0;transition:background .2s,transform .2s}
.dots button[aria-current="true"]{background:var(--terra-glow);border-color:var(--terra-glow);transform:scale(1.25)}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.copy{transition:none}}
</style>
</head>
<body>
<section class="hero" aria-label="Santa Fe International Half Marathon" aria-roledescription="carousel">
  <div class="slide active"><img src="https://santafehalfmarathon.com/wp-content/uploads/2026/02/DSC_5598-scaled.webp" alt="Runners in motion on the high-desert course"></div>
  <div class="slide"><img src="https://santafehalfmarathon.com/wp-content/uploads/2026/09/kids-1k-dash-finisher.avif" alt="A triumphant finisher celebrating at the line"></div>
  <div class="slide"><img src="https://santafehalfmarathon.com/wp-content/uploads/2026/08/DSC-5651-scaled-r900.avif" alt="The Santa Fe course sweeping through the desert valley"></div>
  <div class="scrim"></div>

  <div class="wrap">
    <div class="inner">
      <div class="copy" id="copy">
        <p class="tag"><span class="dot" aria-hidden="true"></span><span id="tagText"></span></p>
        <h1 id="headline" aria-live="polite"></h1>
        <p class="desc" id="desc"></p>
      </div>
      <form class="ask" onsubmit="return false" aria-label="Ask anything (concept mock)">
        <button type="button" class="plus" aria-label="Add">+</button>
        <span class="field">
          <input id="ask" type="text" placeholder=" ">
          <label for="ask">Ask anything about race weekend</label>
        </span>
      </form>
      <p class="note">Concept prototype — not deployed. "Ask anything" is a visual mock.</p>
    </div>
  </div>

  <button class="navbtn prev" aria-label="Previous slide"><svg viewBox="0 0 24 24"><polyline points="14 6 8 12 14 18"/></svg></button>
  <button class="navbtn next" aria-label="Next slide"><svg viewBox="0 0 24 24"><polyline points="10 6 16 12 10 18"/></svg></button>
  <div class="dots" role="tablist" aria-label="Slides"></div>
</section>
<script>
(function(){
  var SLIDES=[
    {tag:"7,000 Feet Altitude Challenge",
     rows:["Thin Air.","Big Sky.","True Grit."],accent:"Run the Santa Fe River.",
     desc:"Conquer the premier high-desert route. An unforgettable running narrative framed by rich New Mexico terracotta peaks and pure mountain atmosphere."},
    {tag:"Finish Line Celebration",
     rows:["Local Spirit.","Global Community."],accent:"Reunity Resources Farm.",
     desc:"More than just a race. Celebrate your achievement at our lively post-run festival featuring local New Mexico food vendors, live music, and community farm vibes."},
    {tag:"Team and Relay Registration",
     rows:["Three Amigos.","One Epic Goal."],accent:"Share the Miles.",
     desc:"Not ready for 13.1 miles alone? Gather your crew for the 3-Amigos Relay or take on the fast, scenic Santa Fe 5K course. There is a distance for everyone."}
  ];
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var copy=document.getElementById('copy'),tagText=document.getElementById('tagText'),
      headline=document.getElementById('headline'),desc=document.getElementById('desc');
  var dotsWrap=document.querySelector('.dots');
  var i=0,timer=null,DWELL=5000;
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  SLIDES.forEach(function(_,n){
    var b=document.createElement('button');
    b.setAttribute('role','tab');b.setAttribute('aria-label','Slide '+(n+1));
    b.addEventListener('click',function(){go(n);restart();});
    dotsWrap.appendChild(b);
  });
  var dots=[].slice.call(dotsWrap.children);
  function renderCopy(n){
    var s=SLIDES[n];
    tagText.textContent=s.tag;
    headline.textContent='';
    s.rows.forEach(function(r){var sp=document.createElement('span');sp.className='row';sp.textContent=r;headline.appendChild(sp);});
    var acc=document.createElement('span');acc.className='row river';acc.textContent=s.accent;headline.appendChild(acc);
    desc.textContent=s.desc;
  }
  function go(n){
    i=(n+SLIDES.length)%SLIDES.length;
    slides.forEach(function(s,k){s.classList.toggle('active',k===i);});
    dots.forEach(function(d,k){d.setAttribute('aria-current',k===i?'true':'false');});
    if(reduced){renderCopy(i);return;}
    copy.classList.add('swap');
    setTimeout(function(){renderCopy(i);copy.classList.remove('swap');},450);
  }
  function restart(){if(timer)clearInterval(timer);if(!reduced)timer=setInterval(function(){go(i+1);},DWELL);}
  renderCopy(0);go(0);restart();
})();
</script>
</body>
</html>
