ept 19: Half Marathon & 3-Amigos Relay","/event-schedule/"],["Packet pickup","10K & 5K: Fri Sept 17 \u2013 Sat Sept 18 at Reunity Resources Farm \xB7 hours TBA","/packet-pickup/"],["Course profile & maps","2027 courses to be USATF-certified \xB7 maps coming soon","/course-map/"],["Kids Dash & charity partners","Free Kids 1K Dash, ages 3\u201312 \xB7 Saturday, Sept 18, 2027 \xB7 time TBA","#kids-race-info","Charity partners","/charity-information/"]],statsLabel:"Race at a glance",ctaHalf:"Register for 2027",cta5k:"Explore the New Course",ribbonLabel:"Presented with",countdown:"Countdown to race weekend",unitD:"d",unitH:"h",unitM:"m",unitS:"s",slides:["The field lines up in golden morning light, wheelchair division up front","Runners stream through the start arch into the crisp early morning air","A lead runner and bike escort climb the open high-desert road","Award winners on the podium at the finish-line festival"],photoTag:"Photo placeholder",prevSlide:"Previous slide",nextSlide:"Next slide",slideLbl:"Slide",racesKicker:"Pick your distance",racesTitle:"Event Info",races:{half:{name:"Half Marathon",dist:"13.1 MI",blurb:"The main event. A 100% paved loop through Agua Fr\xEDa Village and along the Santa Fe River, with +651 ft of total climb topping out at the mile-9 turnaround (6,883 ft). Starts Sunday, Sept 19, 2027 \u2014 time TBA.",note:"Start: Sun, Sept 19, 2027 \xB7 time TBA"},relay:{name:"3-Amigos Relay",dist:"13.1 MI \xB7 team of 3",blurb:"Split the half with two friends: three legs, exchange zones on course, and a ceremonial sash passed hand to hand instead of a baton. One team, one finish-line photo. Starts with the half on Sunday, Sept 19, 2027 \u2014 time TBA.",note:"Start: Sun, Sept 19, 2027 \xB7 time TBA"},fivek:{name:"Santa Fe 5K",dist:"5 KM",blurb:"A welcoming loop through Agua Fr\xEDa Village \u2014 fast if you want it, friendly if you don't. Perfect for first-timers and shakeouts. Starts Saturday, Sept 18, 2027 \u2014 time TBA.",note:"Start: Sat, Sept 18, 2027 \xB7 time TBA"},kids:{name:"Kids Dash",dist:"1 KM",blurb:"Ages 3\u201312, Saturday, Sept 18, 2027 at Reunity Resources Farm \u2014 start time to be announced. Every kid gets a bib and a finish line to remember.",note:"Sat, Sept 18, 2027 \xB7 time TBA \xB7 Reunity Resources Farm"}},register:"Register",regClosed:"2027 registration not open yet",walkup5k:"Walk-up entry at the start line Sunday until 7:45 AM",walkupShort:"5K walk-ups until 7:45 AM",registerFor:a=>"Register for the "+a,courseKicker:"The 2026 course",courseTitle:"Romero's Park to Reunity, the long way round",courseIntro:"The course is new for 2026 \u2014 tap a milestone to walk the route. The profile below tracks the +651 ft of total climb.",waypoints:[{mi:"Mile 0",name:"Romero's Park \u2014 Start",detail:"Roads close at 7:00 AM; the gun goes at 7:30. Ease in \u2014 the altitude does the pacing for you early."},{mi:"Mile 4",name:"Agua Fr\xEDa Village",detail:"Through the historic village and along the river corridor. Find your rhythm here; drink even if you don't feel like it."},{mi:"Mile 9",name:"Turnaround \xB7 6,883 ft",detail:"The high point of the day. It's a steady grade, not a wall \u2014 crest it and the hard work is behind you."},{mi:"Mile 13.1",name:"Reunity Resources \u2014 Finish",detail:"A rolling run-in to the farm. Green chile brunch from Santa Fe YouthWorks is waiting."}],climbLabel:"+651 ft total climb",elevNote:"Profile is illustrative \u2014 the official course map and turn-by-turn come with your race guide.",storyKicker:"More than a race",storyTitle:"Why we run this one",storyBody1:"Three friends started this race \u2014 Abraham Kosgei, Joseph Karnes, and Antonio Lopez \u2014 with a borrowed timing clock and a conviction that Santa Fe deserved a road race worthy of the land we train on. Five editions in, it's still organized by runners, and it still puts the community first.",storyBody2:"Every entry supports the Kitany Water Project, bringing clean water to Kitany, Kenya, and the Lightning Boy Foundation, carrying forward Valentino Tzigiwhaeno Rivera's legacy through Pueblo youth dance. The course is 100% paved, the brunch is cooked by Santa Fe YouthWorks, and the age-group medallions are custom made by Maasai artisans.",storyPhotoAlt:"Runners on the Santa Fe River Trail corridor during the 2025 race",storyPhotoCap:"On course, 2025",charities:["Kitany Water Project","Lightning Boy Foundation"],impact:[{stat:"5th",label:"Annual edition in 2026"},{stat:"100%",label:"Paved course, start to finish"},{stat:"2",label:"Charities supported by every entry"}],voiceEyebrow:"Official Event Narrative",voiceTitle:"The Voice of the River Trail",voiceParas:["I am more than dirt, gravel, and stone. I am the Santa Fe River Trail, a living corridor of history tracing a path through the ancient heart of the high desert. For centuries, my banks have witnessed the movement of peoples, the flow of vital waters, and the quiet resilience of our community. When you run here, you are stepping directly into a story written by the land itself.","My modern chapter began with three friends\u2014Abraham Kosgei, Joseph Karnes, and Antonio Lopez. Long before the race fields assembled, this corridor was their training ground. Driven by a shared conviction, they set out with a borrowed timing clock to design a premier distance race. What began as three friends moving along my banks quickly transformed into a powerful community movement. Five editions in, that foundational spirit remains untouched. The philosophy of the 3 Amigos has evolved to represent a profound alliance of three distinct global cultures joining together to uplift the human spirit through running, sustainable agriculture, and mutual support.","Along my banks, the circle of the 3 Amigos stretches across an ocean. Jirani Kahawa, our coffee partner, trades directly with small-scale agricultural cooperatives in Kenya, returning economic self-reliance to the farmers who grow every cup poured beside my finish line. And when the festival quiets, nothing is wasted: one hundred percent of the spent coffee grounds are captured from the race festival areas and folded back into living soil, closing a circle that begins on a Kenyan hillside and ends in high-desert earth.","Every footstep along my path ripples far beyond our high-desert horizon. Every entry directly supports the Kitany Water Project, bringing clean, life-sustaining water to agricultural communities in Kenya. Simultaneously, your stride carries forward the legacy of the Lightning Boy Foundation, honoring traditional Pueblo youth dance, while fueling local vocational training through Santa Fe YouthWorks and environmental composting cycles at Reunity Resources Farm."],voiceFooter:"Global Unity \u2022 Environmental Sustainability \u2022 Cultural Preservation",impactKicker:"Community & impact",impactTitle:"Two charities. Two community partners.",impactIntro:"Race registration supports two charity partners. Two community partners shape race day itself.",impactCharityLbl:"Charity partner",impactCommunityLbl:"Community & experience partner",impactMission:"Read our mission",partners:[{kind:"charity",name:"Kitany Water Project",body:"Clean, sustainable water for the community of Kitany, Kenya.",href:"/charity-information/",cta:"Charity information",img:"kitany",alt:"Schoolchildren running together on a dirt ground in Kenya's Rift Valley"},{kind:"charity",name:"Lightning Boy Foundation",body:"Carries Valentino Tzigiwhaeno Rivera's legacy forward through Pueblo youth dance.",href:"/charity-information/",cta:"Charity information",img:"lightning",alt:"Lightning Boy Foundation logo"},{kind:"community",name:"Santa Fe YouthWorks",body:"Cooks the green chile brunch at the finish line festival.",href:"/finish-line-festival/",cta:"Finish line festival"},{kind:"community",name:"Reunity Resources Farm",body:"Hosts the finish line and festival, and composts the organic waste from race day.",href:"/finish-line-festival/",cta:"Finish line festival"}],logisticsKicker:"Race-day logistics",logisticsTitle:"Closures, detours and aid stations",logisticsIntro:"Open a panel for the full details.",scheduleKicker:"Race week",scheduleTitle:"September 13\u201320, 2026",schedule:[{date:"Sun, Sept 13",items:[{time:"10 AM\u20131 PM",what:"Recap: Kids 1K Dash runners dyed their own indigo shirts with Gasali Adeyemo, the artist behind the 2026 shirt, at Reunity Resources."}],photos:{credit:"Photos courtesy of Kerri Cottle",group:"Workshop families under the big tree at Reunity Resources, holding up their indigo shirts",table:"Kids fold and tie their shirts at the dye table",shirt:"A young dyer holds up his finished indigo shirt",drying:"Freshly dyed indigo shirts drying on the gravel"}},{date:"Fri, Sept 18",items:[{time:"12\u20136 PM",what:"Packet pickup at the Running Hub, 1100 Don Diego Ave, Suite B."}]},{date:"Sat, Sept 19",items:[{time:"10 AM\u20135 PM",what:"Packet pickup at the Running Hub, day two. Tricia Downing speaks at 1:00 PM."}]},{date:"Sun, Sept 20",items:[{time:"7:00 AM",what:"Course roads close."},{time:"7:30 AM",what:"Half Marathon + 3-Amigos Relay start at Romero's Park."},{time:"8:00 AM",what:"5K starts at Reunity Resources Farm."},{time:"9:00 AM",what:"Kids Dash at Reunity Resources Farm \u2014 ages 3\u201312, free, bibs for everyone."},{time:"All morning",what:"Finish-line brunch at Reunity: YouthWorks green chile, awards, music."}]}],transitTitle:"Official 2026 Transit and Closure Timetable",transitRows:[["Romero's Park Start Area","From 07:00 AM","Rolling Closure","Roads into the start close at 07:00 AM and reopen once the field has left the start. The Half Marathon and 3-Amigos Relay start at 07:30 AM."],["Agua Fria River Corridor","07:15 AM - 12:00 PM","Rolling Barricades","Supports active runner corridors throughout the early village loop miles."],["Caja del Oro Grant Road and Alameda Frontage Road","From 07:00 AM","Total Sector Diversion","Both roads run past Romero's Park at the start. Traffic is diverted from 07:00 AM, and both roads reopen once the field has left the start."],["Reunity Resources Farm Finish Precinct","06:00 AM - 01:00 PM","Local Access Only","Enforces 5K race initialization lines at 08:00 AM and supports post-race festival assemblies."]],driveTitle:"Race Day Driving & Traffic Control Guide",driveIntro:"Driving on race morning? Here is how to get around the course, not through it.",driveCards:[["Agua Fria Corridor: Restricted","The Agua Fria corridor is the race course. From 7:15 AM until late morning, roads along it close and reopen in stages under a rolling closure while runners move from the Romero's Park start line toward the Reunity Resources Farm finish precinct. Local traffic will be held or escorted by traffic control."],["Use the Bypass Arteries","You cannot follow the race route by car. To travel between the start and finish zones, use the major municipal bypasses \u2014 Siler Road, Cerrillos Road, or NM-599 \u2014 and approach each hub from its outside edge. Allow extra time: intersections along the course open only under officer direction."]],aidTitle:"Santa Fe River Trail Aid Stations",aidIntro:"To maximize efficiency along the narrow river trail corridor, stations are built as dual-sided support nodes to serve athletes twice on the out-and-back course layout.",aidCols:["Station Node","Course Locations","Supplies Provided","Access Type"],aidRows:[["Station Alpha","Mile 6 (Outbound) & Mile 12 (Inbound)","Water, Electrolytes, Energy Gels","UTV Shuttle Only"],["Station Beta","Mile 8 (Outbound) & Mile 10 (Inbound)","Water, Electrolytes, Medical Kit","UTV Shuttle Only"]],shuttleTitle:"Race Day Bus Shuttle",shuttleIntro:"A Santa Fe Trails bus runs a continuous shuttle loop on race morning between the three parking areas: Reunity Resources Farm, the San Isidro Church lot across the street, and Romero's Park at the start line.",shuttleLegs:[["To the start \xB7 6:00\u20137:45 AM","Continuous service about every 15 minutes: Reunity Resources Farm, then the San Isidro Church lot, then Romero's Park. Half and Relay runners, ride early \u2014 roads into the start close at 7:00 AM. The final 7:30 AM bus loops back to Reunity in time for the 8:00 AM 5K start."],["Back to parking \xB7 10:00\u201311:30 AM","The loop runs again after the race: Romero's Park, the church lot, then Reunity Resources Farm. Last pickup from Romero's Park at 11:15 AM."]],shuttleNote:"Look for the SANTA FE TRAILS SHUTTLE PICK-UP signs at all three stops. The bus is ADA-accessible; if a bus is full, the next loop is about 15 minutes behind.",shuttleOperatedBy:"Free shuttle provided by",shuttleBusAlt:"Santa Fe Trails bus with its doors open",ambKicker:"Athlete ambassador",ambTitle:"Tricia Downing",ambAlt:"A wheelchair racing athlete powers up the course at dawn",ambRole:"Wheelchair Division Athlete Ambassador",ambBody:"Tricia is the first wheelchair athlete to take on the Santa Fe International Half \u2014 and she's chasing a Paralympic berth in shooting while she's at it. She'll be leading the wheelchair division out at Romero's Park and talking training at the Running Hub on Saturday at 1:00 PM. Come say hi.",ambFacts:["First wheelchair athlete at the SFI Half","Paralympic shooting hopeful","Talk at the Running Hub, Saturday 1:00 PM"],perksKicker:"What you get",perksTitle:"Race perks",perks:[{ic:"Award",name:"Custom made finishers medal",detail:"A finisher medal made to hang on a wall, not in a drawer \u2014 and age-group medallions, both custom made by Maasai artisans."},{ic:"Shirt",name:"Indigo tee by Gasali Adeyemo",detail:"The 2026 official shirt carries an adire pattern by the Santa Fe\u2013based Yoruba dye master. Dyed the slow way, credited the right way."},{ic:"Soup",name:"Green-chile brunch",detail:"Post-race brunch cooked by Santa Fe YouthWorks. Green chile stew, not a granola bar."},{ic:"Timer",name:"Chip timing",detail:"Live splits on race morning and full searchable results after."},{ic:"Camera",name:"Free race photos",detail:"Course and finish-line photos, free to download. No watermark ransom."},{ic:"Backpack",name:"Gear check",detail:"Drop a bag at the start, find it at the finish. Easy."}],travelKicker:"Getting here",travelTitle:"Lodging + travel",travelIntro:"Our Official Lodging Partner holds discounted race-rate rooms across four Santa Fe properties, and the Pecos Trail Inn offers a race-week rate of its own. September fills up; book early.",lodgeEyebrow:"Official Lodging Partner",lodgeName:"Concept Hotel Group",lodgeStatement:"Concept Hotel Group is the Official Lodging Partner of the 2026 Santa Fe International Half Marathon.",lodgeProps:["The Sage Hotel","Coyote South","Inn at Santa Fe","Guadalupe Inn"],lodgeHow:"To secure discounted race rates, email starla@concepthotelgroup.com or call 505-772-0476 and use promo code SHM.",pecosEyebrow:"Also offering race rates",pecosName:"Pecos Trail Inn",pecosDetail:"Classic Santa Fe motor-court charm on the Old Pecos Trail. 15% off for race week, Wednesday September 16 to Tuesday September 22 \u2014 book direct.",code:"Booking code",copy:"Copy code",copied:"Copied!",travelTips:[{name:"Altitude, honestly",detail:"Santa Fe sits at 7,000 ft. Arrive 2\u20133 days early if you can, drink way more water than feels normal, and go easy on your first runs here."},{name:"Three lots, one shuttle",detail:"Half + Relay park at Romero's Park; 5K parks at Reunity Resources; the San Isidro Church lot across from Reunity is the third parking area. A Santa Fe Trails bus loops all three stops before the race (6:00\u20137:45 AM) and after it (10:00\u201311:30 AM)."}],guideKicker:"Know before you go",guideTitle:"Runner Guidelines",guideRules:[["Arrive early","Course roads close at 7:00 AM sharp. Field assembly opens at 7:00 AM at Romero's Park; the Half and Relay start at 7:30, the 5K at 8:00 at Reunity Resources Farm."],["Wear your bib visibly","Your bib is chip-timed \u2014 pin it on your front. Never run under another person's bib; transfers closed September 10."],["Relay: the sash is the baton","The ceremonial sash carries the chip. Runner one wears it from the gun, hand it off at each exchange zone, and runner three must cross the line wearing it \u2014 no sash at the finish, no team time."],["Headphones: one ear out","Keep one ear open for course marshals and cyclists \u2014 and for the drums you don't want to miss."],["Strollers and dogs","Strollers are welcome in the 5K starting from the back. For everyone's safety, no dogs on any course \u2014 they're very welcome at the finish-line party."],["Respect the time limit","The half marathon course is fully supported for 4.5 hours after the 7:30 AM start; after that, roads reopen to traffic on schedule."],["Aid station etiquette","Approach every table on your right. The river-trail stations serve both directions \u2014 miles 6 & 12 and 8 & 10 \u2014 with restrooms at every station."],["Leave no trace","Drop cups and organics in the station bins \u2014 everything is captured and composted at Reunity Resources Farm. Pack out what you pack in."]],kidsKicker:"Youth Wellness Event",kidsTitle:"Kids 1K Dash",kidsMeta:"Date: Saturday, September 18, 2027 \xB7 Time: TBA \xB7 Venue: Reunity Resources Farm",kidsP1:"The Kids 1K Dash runs Saturday, September 18, 2027 at Reunity Resources Farm, 1829 San Ysidro Crossing. The start time will be announced.",kidsP2:"It\u2019s free for kids ages 3 to 12. Every kid gets a bib, and every finisher gets a medal. It isn\u2019t chip-timed.",kidsTag:"Empowering Youth through Sport, Agriculture, and Community",kidsCta:"Register Youth Athlete",faqKicker:"Good to know",faqTitle:"FAQ",faqs:[{q:"How do I handle the altitude?",a:"Santa Fe sits at 7,000 feet, and it hits different if you're coming from sea level. Arrive two or three days early if you can, keep a water bottle glued to your hand all week, ease off the pace on the climbs, and don't judge your fitness by your first shakeout here. The air is thin; that's the point."},{q:"Where is packet pickup?",a:"Friday, Sept 18 from 12\u20136 PM and Saturday, Sept 19 from 10 AM\u20135 PM. Pick up your bib and shirt at the Running Hub, 1100 Don Diego Ave, Suite B. The 2026 race is sold out, so no new entries are available. Half Marathon and 3-Amigos Relay runners can also pick up race morning, 6:00\u20137:00 AM at Romero's Park (the start line). 5K runners pick up at the Running Hub."},{q:"How does the relay sash work?",a:"The 3-Amigos Relay uses a ceremonial sash instead of a baton. Runner one wears it from the start, hands it off at each exchange zone, and runner three wears it across the line. The sash is chip-timed \u2014 no sash at the finish, no team time."},{q:"Is there a time limit?",a:"Yes \u2014 the half marathon course is fully supported for 4.5 hours after the 7:30 AM start. If you're near the back you'll still get a finish line; the course simply reopens to traffic on that schedule."},{q:"When does registration close?",a:{open:"Online registration closes Saturday, September 19 at 5:00 PM for every race: the Half Marathon, the 3-Amigos Relay, the Santa Fe 5K and the free Kids 1K Dash. Sign up on RunSignup before then.",walkup:"Online registration closed Thursday, September 17. You can register in person for any race during packet pickup hours and pay on site. On race morning, the Santa Fe 5K also takes walk-up entries at the 5K start line at Reunity Resources Farm, until 7:45 AM.",closed:"Registration for 2027 isn't open yet. Race weekend is Saturday, Sept 18 \u2013 Sunday, Sept 19, 2027. Sign up for race updates to hear when it opens."}[x]},{q:"Can I defer or transfer my entry?",a:"Entries are non-refundable. The free deferral and bib-transfer window closed on September 10, 2026, so entries can no longer be deferred or transferred, and there are no race-day changes."}],bannerDate:"Next race: Sept 18\u201319, 2027",tierCommunity:"Community Partners",sponsorsKicker:"Race partners",sponsorsTitle:"Thank You to Our 2026 Sponsors",tierTi s\xE1b 18 sept 2027 \xB7 hora por anunciar"},kids:{name:"Kids Dash",dist:"1 KM",blurb:"De 3 a 12 a\xF1os, el s\xE1bado 18 de septiembre de 2027 en Reunity Resources Farm \u2014 hora por anunciar. Cada ni\xF1o recibe un n\xFAmero y una meta para recordar.",note:"S\xE1b 18 sept 2027 \xB7 hora por anunciar \xB7 Reunity Resources Farm"}},register:"Inscr\xEDbete",regClosed:"Inscripci\xF3n 2027 a\xFAn no abierta",walkup5k:"Inscripci\xF3n en persona en la salida el domingo hasta las 7:45 AM",walkupShort:"5K en persona hasta 7:45 AM",registerFor:a=>"Inscr\xEDbete en el "+a,courseKicker:"La ruta 2026",courseTitle:"De Romero's Park a Reunity, por el camino largo",courseIntro:"La ruta es nueva en 2026 \u2014 toca un punto para recorrerla. El perfil muestra los +651 pies de ascenso total.",waypoints:[{mi:"Milla 0",name:"Romero's Park \u2014 Salida",detail:"Las calles cierran a las 7:00 AM; el disparo es a las 7:30. Empieza con calma \u2014 la altitud marca el ritmo al principio."},{mi:"Milla 4",name:"Agua Fr\xEDa Village",detail:"Por el pueblo hist\xF3rico y el corredor del r\xEDo. Encuentra tu ritmo aqu\xED; hidr\xE1tate aunque no tengas sed."},{mi:"Milla 9",name:"Retorno \xB7 6,883 pies",detail:"El punto m\xE1s alto del d\xEDa. Es una pendiente constante, no un muro \u2014 p\xE1sala y lo dif\xEDcil qued\xF3 atr\xE1s."},{mi:"Milla 13.1",name:"Reunity Resources \u2014 Meta",detail:"Una llegada suave hasta la granja. Te espera brunch de chile verde de Santa Fe YouthWorks."}],climbLabel:"+651 pies de ascenso total",elevNote:"Perfil ilustrativo \u2014 el mapa oficial llega con tu gu\xEDa de carrera.",storyKicker:"M\xE1s que una carrera",storyTitle:"Por qu\xE9 corremos esta",storyBody1:"Tres amigos fundaron esta carrera \u2014 Abraham Kosgei, Joseph Karnes y Antonio Lopez \u2014 con un reloj prestado y la convicci\xF3n de que Santa Fe merec\xEDa una carrera a la altura de la tierra donde entrenamos. Cinco ediciones despu\xE9s, la siguen organizando corredores, y la comunidad sigue primero.",storyBody2:"Cada inscripci\xF3n apoya al Kitany Water Project, que lleva agua limpia a Kitany, Kenia, y a la Lightning Boy Foundation, que honra el legado de Valentino Tzigiwhaeno Rivera a trav\xE9s de la danza de j\xF3venes Pueblo. La ruta es 100% pavimentada, el brunch lo cocina Santa Fe YouthWorks, y los medallones de grupo de edad est\xE1n hechos a medida por artesanos mas\xE1i.",storyPhotoAlt:"Corredores en el corredor del Santa Fe River Trail durante la carrera de 2025",storyPhotoCap:"En el recorrido, 2025",charities:["Kitany Water Project","Lightning Boy Foundation"],impact:[{stat:"5\xAA",label:"Edici\xF3n anual en 2026"},{stat:"100%",label:"Ruta pavimentada, de salida a meta"},{stat:"2",label:"Causas apoyadas con cada inscripci\xF3n"}],voiceEyebrow:"Narrativa oficial del evento",voiceTitle:"La voz del River Trail",voiceParas:["Soy m\xE1s que tierra, grava y piedra. Soy el Santa Fe River Trail, un corredor vivo de historia que traza un camino por el antiguo coraz\xF3n del alto desierto. Durante siglos, mis orillas han sido testigo del movimiento de los pueblos, del flujo de aguas vitales y de la callada resiliencia de nuestra comunidad. Cuando corres aqu\xED, entras directamente en una historia escrita por la tierra misma.","Mi cap\xEDtulo moderno comenz\xF3 con tres amigos: Abraham Kosgei, Joseph Karnes y Antonio Lopez. Mucho antes de que se reunieran los grupos de corredores, este corredor era su terreno de entrenamiento. Movidos por una convicci\xF3n compartida, salieron con un reloj prestado a dise\xF1ar una carrera de fondo de primer nivel. Lo que empez\xF3 como tres amigos avanzando por mis orillas se transform\xF3 pronto en un poderoso movimiento comunitario. Cinco ediciones despu\xE9s, ese esp\xEDritu fundacional sigue intacto. La filosof\xEDa de los 3 Amigos ha evolucionado hasta representar una profunda alianza de tres culturas globales distintas que se unen para elevar el esp\xEDritu humano a trav\xE9s del running, la agricultura sostenible y el apoyo mutuo.","En mis orillas, el c\xEDrculo de los 3 Amigos se extiende a trav\xE9s de un oc\xE9ano. Jirani Kahawa, nuestro socio cafetero, comercia directamente con peque\xF1as cooperativas agr\xEDcolas de Kenia, devolviendo autosuficiencia econ\xF3mica a los caficultores que cultivan cada taza servida junto a mi meta. Y cuando la fiesta se apaga, nada se desperdicia: el cien por ciento de la borra de caf\xE9 se recupera de las \xE1reas del festival y vuelve a la tierra viva, cerrando un c\xEDrculo que comienza en una ladera keniana y termina en el suelo del alto desierto.","Cada pisada en mi camino resuena mucho m\xE1s all\xE1 de nuestro horizonte del alto desierto. Cada inscripci\xF3n apoya directamente al Kitany Water Project, llevando agua limpia y vital a comunidades agr\xEDcolas de Kenia. Al mismo tiempo, tu zancada lleva adelante el legado de la Lightning Boy Foundation, honrando la danza tradicional juvenil Pueblo, mientras impulsa la formaci\xF3n vocacional local con Santa Fe YouthWorks y los ciclos de compostaje ambiental en Reunity Resources Farm."],voiceFooter:"Unidad global \u2022 Sostenibilidad ambiental \u2022 Preservaci\xF3n cultural",impactKicker:"Comunidad e impacto",impactTitle:"Dos causas. Dos socios comunitarios.",impactIntro:"Tu inscripci\xF3n apoya a dos organizaciones ben\xE9ficas. Dos socios comunitarios dan forma al d\xEDa de la carrera.",impactCharityLbl:"Organizaci\xF3n ben\xE9fica",impactCommunityLbl:"Socio comunitario y de experiencia",impactMission:"Lee nuestra misi\xF3n",partners:[{kind:"charity",name:"Kitany Water Project",body:"Agua limpia y sostenible para la comunidad de Kitany, Kenia.",href:"/charity-information/",cta:"Informaci\xF3n ben\xE9fica",img:"kitany",alt:"Escolares corriendo juntos sobre tierra en el Valle del Rift de Kenia"},{kind:"charity",name:"Lightning Boy Foundation",body:"Honra el legado de Valentino Tzigiwhaeno Rivera a trav\xE9s de la danza juvenil Pueblo.",href:"/charity-information/",cta:"Informaci\xF3n ben\xE9fica",img:"lightning",alt:"Logotipo de la Lightning Boy Foundation"},{kind:"community",name:"Santa Fe YouthWorks",body:"Cocina el brunch de chile verde en el festival de la meta.",href:"/finish-line-festival/",cta:"Festival en la meta"},{kind:"community",name:"Reunity Resources Farm",body:"Recibe la meta y el festival, y composta los residuos org\xE1nicos del d\xEDa de la carrera.",href:"/finish-line-festival/",cta:"Festival en la meta"}],logisticsKicker:"Log\xEDstica del d\xEDa de carrera",logisticsTitle:"Cierres, desv\xEDos y puestos de hidrataci\xF3n",logisticsIntro:"Abre un panel para ver todos los detalles.",scheduleKicker:"Semana de carrera",scheduleTitle:"13\u201320 de septiembre, 2026",schedule:[{date:"Dom 13 sept",items:[{time:"10 AM\u20131 PM",what:"Resumen: los corredores del Kids 1K Dash ti\xF1eron sus propias playeras \xEDndigo con Gasali Adeyemo, el artista de la playera 2026, en Reunity Resources."}],photos:{credit:"Fotos cortes\xEDa de Kerri Cottle",group:"Familias del taller bajo el gran \xE1rbol de Reunity Resources, mostrando sus playeras \xEDndigo",table:"Ni\xF1os doblan y atan sus playeras en la mesa de te\xF1ido",shirt:"Un joven tintorero muestra su playera \xEDndigo terminada",drying:"Playeras reci\xE9n te\xF1idas de \xEDndigo sec\xE1ndose sobre la grava"}},{date:"Vie 18 sept",items:[{time:"12\u20136 PM",what:"Entrega de paquetes en The Running Hub, 1100 Don Diego Ave, Suite B."}]},{date:"S\xE1b 19 sept",items:[{time:"10 AM\u20135 PM",what:"Entrega de paquetes en The Running Hub, segundo d\xEDa. Charla de Tricia Downing a la 1:00 PM."}]},{date:"Dom 20 sept",items:[{time:"7:00 AM",what:"Cierre de calles de la ruta."},{time:"7:30 AM",what:"Salida del Medio Marat\xF3n + Relevo 3-Amigos en Romero's Park."},{time:"8:00 AM",what:"Salida del 5K en Reunity Resources Farm."},{time:"9:00 AM",what:"Kids Dash en Reunity Resources Farm \u2014 de 3 a 12 a\xF1os, gratis, n\xFAmeros para todos."},{time:"Toda la ma\xF1ana",what:"Brunch de meta en Reunity: chile verde de YouthWorks, premios, m\xFAsica."}]}],transitTitle:"Horario oficial de tr\xE1nsito y cierres 2026",transitRows:[["Zona de salida Romero's Park","Desde las 07:00 AM","Cierre m\xF3vil","Las calles hacia la salida cierran a las 07:00 AM y reabren cuando todos los corredores han dejado la zona de salida. El Medio Marat\xF3n y el Relevo 3-Amigos salen a las 07:30 AM."],["Corredor del r\xEDo Agua Fr\xEDa","07:15 AM - 12:00 PM","Barricadas m\xF3viles","Protege los corredores activos en las primeras millas del circuito del pueblo."],["Caja del Oro Grant Road y Alameda Frontage Road","Desde las 07:00 AM","Desv\xEDo total del sector","Ambas v\xEDas pasan junto a la salida en Romero's Park. El tr\xE1fico se desv\xEDa desde las 07:00 AM y ambas reabren cuando todos los corredores han dejado la zona de salida."],["Recinto de meta Reunity Resources Farm","06:00 AM - 01:00 PM","Solo acceso local","Aplica las l\xEDneas de salida del 5K a las 08:00 AM y alberga el festival posterior a la carrera."]],driveTitle:"Gu\xEDa de manejo y control de tr\xE1fico el d\xEDa de la carrera",driveIntro:"\xBFVas a manejar la ma\xF1ana de la carrera? As\xED se rodea la ruta, no se atraviesa.",driveCards:[["Corredor de Agua Fr\xEDa: restringido","El corredor de Agua Fr\xEDa es la ruta de la carrera. Desde las 7:15 AM hasta media ma\xF1ana, las calles a lo largo del corredor cierran y reabren por tramos con un cierre m\xF3vil mientras los corredores avanzan de la salida en Romero's Park hacia el recinto de meta de Reunity Resources Farm. El tr\xE1fico local ser\xE1 detenido o escoltado por control de tr\xE1fico."],["Usa las arterias alternas","No puedes seguir la ruta de la carrera en auto. Para moverte entre las zonas de salida y meta, usa las v\xEDas principales de la ciudad \u2014 Siler Road, Cerrillos Road o la NM-599 \u2014 y ac\xE9rcate a cada punto desde su lado exterior. Da tiempo extra: las intersecciones de la ruta abren solo bajo indicaci\xF3n de los oficiales."]],aidTitle:"Puestos de hidrataci\xF3n del Santa Fe River Trail",aidIntro:"Para maximizar la eficiencia en el estrecho corredor del river trail, los puestos est\xE1n construidos como nodos de apoyo de doble cara que atienden a los atletas dos veces en la ruta de ida y vuelta.",aidCols:["Puesto","Ubicaciones en la ruta","Suministros","Tipo de acceso"],aidRows:[["Puesto Alfa","Milla 6 (ida) & Milla 12 (vuelta)","Agua, electrolitos, geles energ\xE9ticos","Solo shuttle UTV"],["Puesto Beta","Milla 8 (ida) & Milla 10 (vuelta)","Agua, electrolitos, botiqu\xEDn m\xE9dico","Solo shuttle UTV"]],shuttleTitle:"Shuttle en bus el d\xEDa de la carrera",shuttleIntro:"Un bus de Santa Fe Trails recorre un circuito continuo la ma\xF1ana de la carrera entre las tres \xE1reas de estacionamiento: Reunity Resources Farm, el lote de la iglesia San Isidro al cruzar la calle, y Romero's Park en la l\xEDnea de salida.",shuttleLegs:[["Hacia la salida \xB7 6:00\u20137:45 AM","Servicio continuo aproximadamente cada 15 minutos: Reunity Resources Farm, luego el lote de la iglesia San Isidro, luego Romero's Park. Corredores del Medio y el Relevo, suban temprano \u2014 las calles hacia la salida cierran a las 7:00 AM. El \xFAltimo bus de las 7:30 AM regresa a Reunity a tiempo para la salida del 5K a las 8:00 AM."],["De regreso al estacionamiento \xB7 10:00\u201311:30 AM","El circuito corre de nuevo despu\xE9s de la carrera: Romero's Park, el lote de la iglesia, y Reunity Resources Farm. \xDAltima recogida en Romero's Park a las 11:15 AM."]],shuttleNote:"Busca los letreros SANTA FE TRAILS SHUTTLE PICK-UP en las tres paradas. El bus es accesible (ADA); si un bus va lleno, el siguiente pasa en unos 15 minutos.",shuttleOperatedBy:"Shuttle gratuito ofrecido por",shuttleBusAlt:"Autob\xFAs de Santa Fe Trails con las puertas abiertas",ambKicker:"Atleta embajadora",ambTitle:"Tricia Downing",ambAlt:"Una atleta en silla de carreras sube por la ruta al amanecer",ambRole:"Embajadora de la Divisi\xF3n en Silla de Ruedas",ambBody:"Tricia es la primera atleta en silla de ruedas en correr el Medio Internacional de Santa Fe \u2014 y mientras tanto busca un lugar paral\xEDmpico en tiro deportivo. Liderar\xE1 la divisi\xF3n en silla de ruedas desde Romero's Park y hablar\xE1 de entrenamiento en The Running Hub a la 1:00 PM. Ven a saludarla.",ambFacts:["Primera atleta en silla de ruedas del Medio SFI","Aspirante paral\xEDmpica en tiro deportivo","Charla en The Running Hub \u2014 s\xE1bado 1:00 PM"],perksKicker:"Lo que recibes",perksTitle:"Beneficios",perks:[{ic:"Award",name:"Medalla de finisher personalizada",detail:"Una medalla de finisher hecha para colgarse en la pared, no en un caj\xF3n \u2014 y medallones de grupo de edad, ambos hechos a medida por artesanos mas\xE1i."},{ic:"Shirt",name:"Playera \xEDndigo de Gasali Adeyemo",detail:"La playera oficial 2026 lleva un dise\xF1o adire del maestro yoruba radicado en Santa Fe. Te\xF1ida a la manera lenta, con el cr\xE9dito bien puesto."},{ic:"Soup",name:"Brunch de chile verde",detail:"Brunch post-carrera cocinado por Santa Fe YouthWorks. Guiso de chile verde, no una barrita."},{ic:"Timer",name:"Cronometraje con chip",detail:"Parciales en vivo la ma\xF1ana de la carrera y resultados completos despu\xE9s."},{ic:"Camera",name:"Fotos gratis",detail:"Fotos de ruta y de meta, gratis para descargar. Sin rescate de marca de agua."},{ic:"Backpack",name:"Guardarropa",detail:"Deja tu mochila en la salida y rec\xF3gela en la meta. F\xE1cil."}],travelKicker:"C\xF3mo llegar",travelTitle:"Hospedaje + viaje",travelIntro:"Nuestro socio oficial de hospedaje reserva habitaciones con tarifa de carrera en cuatro propiedades de Santa Fe, y el Pecos Trail Inn ofrece su propia tarifa para la semana de carrera. Septiembre se llena; reserva pronto.",lodgeEyebrow:"Socio oficial de hospedaje",lodgeName:"Concept Hotel Group",lodgeStatement:"Concept Hotel Group es el socio oficial de hospedaje del Medio Marat\xF3n Internacional de Santa Fe 2026.",lodgeProps:["The Sage Hotel","Coyote South","Inn at Santa Fe","Guadalupe Inn"],lodgeHow:"Para asegurar tarifas de carrera con descuento, escribe a starla@concepthotelgroup.com o llama al 505-772-0476 y usa el c\xF3digo promocional SHM.",pecosEyebrow:"Tambi\xE9n con tarifa de carrera",pecosName:"Pecos Trail Inn",pecosDetail:"Encanto cl\xE1sico de motor-court en el Old Pecos Trail. 15% de descuento para la semana de carrera, del mi\xE9rcoles 16 al martes 22 de septiembre \u2014 reserva directo.",code:"C\xF3digo de reserva",copy:"Copiar c\xF3digo",copied:"\xA1Copiado!",travelTips:[{name:"La altitud, sin rodeos",detail:"Santa Fe est\xE1 a 7,000 pies. Llega 2\u20133 d\xEDas antes si puedes, toma mucha m\xE1s agua de lo normal, y corre suave tus primeros d\xEDas aqu\xED."},{name:"Tres lotes, un shuttle",detail:"Medio + Relevo estacionan en Romero's Park; el 5K en Reunity Resources; el lote de la iglesia San Isidro frente a Reunity es la tercera \xE1rea. Un bus de Santa Fe Trails recorre las tres paradas antes de la carrera (6:00\u20137:45 AM) y despu\xE9s (10:00\u201311:30 AM)."}],guideKicker:"Antes de correr",guideTitle:"Gu\xEDa del corredor",guideRules:[["Llega temprano","Las calles de la ruta cierran a las 7:00 AM en punto. La concentraci\xF3n abre a las 7:00 AM en Romero's Park; el Medio y el Relevo salen a las 7:30, el 5K a las 8:00 en Reunity Resources Farm."],["Lleva tu n\xFAmero visible","Tu n\xFAmero lleva el chip \u2014 pr\xE9ndelo al frente. Nunca corras con el n\xFAmero de otra persona; las transferencias cerraron el 10 de septiembre."],["Relevo: la banda es el testigo","La banda ceremonial lleva el chip. El primer corredor la usa desde el disparo, se entrega en cada zona de cambio, y el tercero debe cruzar la meta con ella puesta \u2014 sin banda en la meta, no hay tiempo de equipo."],["Aud\xEDfonos: un o\xEDdo libre","Mant\xE9n un o\xEDdo atento a los oficiales de ruta y ciclistas \u2014 y a los tambores que no te quieres perder."],["Carriolas y perros","Las carriolas son bienvenidas en el 5K saliendo al final. Por seguridad, no se permiten perros en ninguna ruta \u2014 son muy bienvenidos en la fiesta de la meta."],["Respeta el l\xEDmite de tiempo","El medio marat\xF3n tiene apoyo completo durante 4.5 horas desde la salida de 7:30 AM; despu\xE9s, las calles reabren al tr\xE1fico seg\xFAn lo programado."],["Etiqueta en los puestos","Ac\xE9rcate a cada mesa por tu derecha. Los puestos del river trail atienden en ambas direcciones \u2014 millas 6 y 12, y 8 y 10 \u2014 con ba\xF1os en cada puesto."],["No dejes rastro","Deposita vasos y org\xE1nicos en los botes de cada puesto \u2014 todo se recupera y se composta en Reunity Resources Farm. Ll\xE9vate lo que traigas."]],kidsKicker:"Evento de bienestar juvenil",kidsTitle:"Kids 1K Dash",kidsMeta:"Fecha: s\xE1bado 18 de septiembre de 2027 \xB7 Hora: por anunciar \xB7 Lugar: Reunity Resources Farm",kidsP1:"El Kids 1K Dash es el s\xE1bado 18 de septiembre de 2027 en Reunity Resources Farm, 1829 San Ysidro Crossing. La hora se anunciar\xE1.",kidsP2:"Es gratis para ni\xF1os de 3 a 12 a\xF1os. Cada ni\xF1o recibe un dorsal y, al llegar a la meta, una medalla. No se cronometra con chip.",kidsTag:"Impulsando a la juventud con deporte, agricultura y comunidad",kidsCta:"Inscribe a tu atleta juvenil",faqKicker:"Bueno saberlo",faqTitle:"Preguntas frecuentes",faqs:[{q:"\xBFC\xF3mo manejo la altitud?",a:"Santa Fe est\xE1 a 7,000 pies, y se siente distinto si vienes del nivel del mar. Llega dos o tres d\xEDas antes si puedes, trae una botella de agua pegada a la mano toda la semana, baja el ritmo en las subidas, y no juzgues tu condici\xF3n por tu primer trote aqu\xED. El aire es delgado; de eso se trata."},{q:"\xBFD\xF3nde es la entrega de paquetes?",a:"Viernes 18 de sept de 12\u20136 PM y s\xE1bado 19 de sept de 10 AM\u20135 PM. Recoge tu n\xFAmero y playera en The Running Hub, 1100 Don Diego Ave, Suite B. La carrera 2026 est\xE1 agotada, as\xED que ya no hay inscripciones disponibles. Los corredores del Medio Marat\xF3n y del Relevo 3-Amigos tambi\xE9n pueden recogerlo la ma\xF1ana de la carrera, de 6:00 a 7:00 AM en Romero's Park (la salida). Los del 5K lo recogen en The Running Hub."},{q:"\xBFC\xF3mo funciona la banda del relevo?",a:"El Relevo 3-Amigos usa una banda ceremonial en lugar de testigo. El primer corredor la lleva desde la salida, la entrega en cada zona de cambio, y el tercero cruza la meta con ella puesta. La banda lleva el chip \u2014 sin banda en la meta, no hay tiempo de equipo."},{q:"\xBFHay l\xEDmite de tiempo?",a:"S\xED \u2014 el medio marat\xF3n tiene apoyo completo durante 4.5 horas desde la salida de 7:30 AM. Si vas al final, igual tendr\xE1s tu meta; la ruta simplemente se reabre al tr\xE1fico en ese horario."},{q:"\xBFCu\xE1ndo cierra la inscripci\xF3n?",a:{open:"La inscripci\xF3n en l\xEDnea cierra el s\xE1bado 19 de septiembre a las 5:00 PM para todas las carreras: el Medio Marat\xF3n, el Relevo 3-Amigos, el Santa Fe 5K y el Kids 1K Dash gratuito. Inscr\xEDbete en RunSignup antes de esa hora.",walkup:"La inscripci\xF3n en l\xEDnea cerr\xF3 el jueves 17 de septiembre. Puedes inscribirte en persona para cualquier carrera durante el horario de entrega de paquetes y pagar ah\xED mismo. La ma\xF1ana de la carrera, el Santa Fe 5K tambi\xE9n acepta inscripciones en la salida del 5K en Reunity Resources Farm, hasta las 7:45 AM.",closed:"La inscripci\xF3n para 2027 a\xFAn no est\xE1 abierta. El fin de semana de carrera es del s\xE1bado 18 al domingo 19 de septiembre de 2027. Suscr\xEDbete a las novedades de la carrera para saber cu\xE1ndo abre."}[x]},{q:"\xBFPuedo transferir o diferir mi inscripci\xF3n?",a:"Las inscripciones no son reembolsables. El plazo gratuito para diferir la inscripci\xF3n o transferir el n\xFAmero cerr\xF3 el 10 de septiembre de 2026, as\xED que ya no se aceptan aplazamientos ni transferencias, y no hay cambios el d\xEDa de la carrera."}],bannerDate:"Pr\xF3xima carrera: 18\u201319 sept 2027",tierCommunity:"Aliados Comunitarios",
